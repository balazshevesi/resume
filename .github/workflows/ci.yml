name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
        working-directory: source
      - run: bun run lint
        working-directory: source
      - run: bun run get-fonts
        working-directory: source
      - run: bun test --run
        working-directory: source
      - run: bun run build
        working-directory: source
      - run: bun run generate-pdf
        working-directory: source
